spring.application.name=FoodBySpringBoot

# Server port
Server.port=8080

# Database config
spring.datasource.url=jdbc:h2:file:./db/blogdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=pass987
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# setup local h2 database console
spring.h2.console.enabled=true
spring.h2.console.path=/db-console
spring.h2.console.settings.web-allow-others=false

# local h2 tables setup on startup; use the value "none" in production!
# create data when start drop when app is stop running
spring.jpa.hibernate.ddl-auto=create-drop
# spring.jpa.hibernate.ddl-auto=update

# spring.mvc.static-path-pattern=/static/**

# Enable lazy loading
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Thyemeleaf settings
# Thyemeleaf is Java template engine
thymeleaf.version=3.0.4.RELEASE
thymeleaf-layout-dialect.version=2.1.1 


# Static files setting
spring.mvc.static-path-pattern=/resources/static/**

# Application settings
password.token.reset.timeout.minutes=600
site.domain=http://localhost:8080/


# Email settings
spring.config.import=optional:secrect.properties

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.smtp.ssl.trust=smtp.gmail.com
mail.transport.protocol=smtp

# Logging setting


logging.level.com.vengat.FoodBySpringBoot
logging.pattern.console=%d [%level] %c{1.} [%t] %m%n
logging.file.name = appLog.log
logging.pattern.file=%d [%level] %c{1.} [%t] %m%n